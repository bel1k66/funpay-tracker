name: FunPay Tracker

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: funpay-tracker-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python funpay_parse_step1.py

      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add lot_lifecycle.csv

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update market data"

          # Safe push for concurrent runs: rebase onto latest remote and retry.
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "Push failed on attempt ${attempt}, retrying in 3s..."
            sleep 3
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push after 3 attempts"
            exit 1
          fi
