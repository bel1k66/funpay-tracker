name: FunPay Tracker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: funpay-tracker-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python funpay_parse_step1.py

      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
     
          pushed=0
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: rebuild on latest origin/${GITHUB_REF_NAME}"

            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            python funpay_parse_step1.py

            git add lot_lifecycle.csv
            if git diff --cached --quiet; then
              echo "No changes"
              pushed=1
              break
            fi

            git commit -m "Update market data"

            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi

            echo "Push failed on attempt ${attempt}, retrying in 3s..."
            sleep 3
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push after 3 attempts"
            exit 1
          fi
